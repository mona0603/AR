<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Map</title>
  <link rel="icon" href="resources/UI/migracion.png" type="image/png">

  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <!-- Fonts Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
  crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <link rel="stylesheet" href="css/world.css">
</head>
<body>

  <!-- ================= UI ================= -->
  <a id="close" href="menu.html" data-sfx>
    <span><i class="fa-solid fa-chevron-left"></i></span>
  </a>
  <div id="goal-badge">⚽ <span id="goal-count">0</span></div>

  <div class="message" style="display: none;">
    <div id="m-close" data-sfx>
      <span>✖</span>
    </div>
    <i class="fa-solid fa-lock"></i>
    <span id="m-text">Message example.</span>
    <a id="m-play" href="dns.html">
      <!-- <span>✖</span> -->
      <div class="mp-img" data-sfx><img src="resources/UI/jugar.png" alt=""></div>
    </a>
  </div>


  <div id="country-ui">
    <div id="country-close" data-sfx>
      <span>✖</span>
    </div>
    <div class="ui-header">
      <div class="ui-title">
        <!-- Nombre del pais -->
        <div class="ui-wrap-title">
          <div class="uic"><img src="resources/UI/migracion.png" alt=""></div>
          <div class="ui-country"></div>
        </div>
      </div>
      <!-- Mensaje de indicacion -->
      <div id="country-name">
        <i class="fa-regular fa-hand-point-right"></i>
        Scan to interact.</div>
    </div>
    <div id="country-buttons">
      <div class="city-btns" id="city-btns" style="display:none">
        <!-- se llena dinámicamente -->
      </div>
    </div>
  </div>
  <!-- Cursor visual centrado -->
  <!-- <div id="cursor-center"></div> -->

  <!-- ================= AR ================= -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets/worldmap.mind;
                  autoStart: true;
                  uiScanning: no;
                  filterMinCF: 0.05;
                  filterBeta: 5;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; colorManagement: true;"
    device-orientation-permission-ui="enabled: false"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable; far: 100">

    <a-assets>
      <a-asset-item id="mi-mundo" src="./models/earth.glb"></a-asset-item>
      <img id="mexico" src="targets/planes/mexico.png">
      <img id="usa" src="targets/planes/usa.png">
      <img id="canada" src="targets/planes/canada.png">
    </a-assets>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity scale="0.08 0.08 0.08">
        <a-entity id="anchor">
          <a-entity id="pivot" touch-rotate>

            <!-- Globo -->
            <a-entity gltf-model="#mi-mundo"></a-entity>

            <!-- Países -->
            <a-entity id="paises-wrapper">

              <a-plane class="clickable"
                geo-position="lat: 140; lon: 0; radio: 9"
                width="3" height="1.5"
                material="src: #canada; transparent: true"
                pais="nombre: CANADA"
                side="double">
              </a-plane>

              <a-plane class="clickable"
                geo-position="lat: 125; lon: 0; radio: 9"
                width="3" height="1.5"
                material="src: #usa; transparent: true"
                pais="nombre: USA"
                side="double">
              </a-plane>

              <a-plane class="clickable"
                geo-position="lat: 110; lon: 0; radio: 9"
                width="3" height="1.5"
                material="src: #mexico; transparent: true"
                pais="nombre: MEXICO"
                side="double">
              </a-plane>

            </a-entity>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-entity>

    <a-camera fov="60" position="0 0 0"
      look-controls="enabled: false"
      wasd-controls="enabled: false">
      <a-cursor
        fuse="false"
        color="white"
        opacity="1"
        geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02"
        material="color: white; shader: flat"
        position="0 0 -0.5"
        raycaster="objects: .clickable">
      </a-cursor>
    </a-camera>

  </a-scene>

  <script src="js/audio.js"></script>
  <script src="js/ascene.js"></script>
</body>
</html>
