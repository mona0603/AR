<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap & Shoot</title>
  <link rel="icon" href="resources/UI/bola.png" type="image/png">

  <!-- MINDAR.JS -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <!-- .CSS -->
  <link rel="stylesheet" href="css/dns.css">

  <!-- Fonts Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
  crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <canvas id="star-canvas" style="position:fixed;top:0;left:0;pointer-events:none;z-index:99;"></canvas>

  <!-- /////////////////        DISEÑO         ///////////////// -->
  
  <!-- redirigir al menu -->
  <a id="close" href="menu.html" data-sfx>
    <span><i class="fa-solid fa-chevron-left"></i></span>
  </a>

  <!-- Mensaje: haz compleado x cosa ir aqui... -->
  <div class="wrapper-msg" data-ui style="display: none;">
    <div class="dns-message">
      <!-- close -->
      <div id="hide" data-sfx>
        <span>✖</span>
      </div>
      <!-- Container sobrepuesto para diseño de icono -->
      <div class="dnsm-i">
        <div class="i-img">
          <div class="ii-img">
            <img src="resources/UI/desbloquear.png" alt="">
          </div>
        </div>
      </div>
      <!-- Titulo -->
      <div class="dnsm-uno">
        <span>TITLE</span>
      </div>
      <!-- Texto: "Haz desbloqueado x cosa" -->
      <div class="dnsm-dos">
        <span><i class="fa-regular fa-hand-point-right"></i></span>
        <span>This a text example.</span>
      </div>
    </div>
    <!-- btn -->
    <div class="dns-go" >
      <div class="dnsg-btn" data-sfx>
        <span>CHECK OUT</span>
      </div>
    </div>
  </div>

  <!-- Score -->
   <div class="score">
      <span>⚽</span>
      <span>0</span>
   </div>
  <div class="timer">
      <div class="timer-wrapper">
        <div class="tw">
          <div class="tw-img"><img src="resources/UI/despertador.png" alt=""></div>
        </div>
      </div>
      <div class="tw-00">
          <span>00 :</span>
          <span>30</span>
        </div>
    </div>
  <!-- /////////////////        AR         ///////////////// -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets/tns.mind;
                  autoStart: true;
                  uiScanning: no;
                  filterMinCF: 0.001;
                  filterBeta: 0.01;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; colorManagement: true;"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item id="ball-model" src="./models/FootBall.glb"></a-asset-item>
      <a-asset-item id="net-model"  src="./models/net.glb"></a-asset-item>
    </a-assets>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity scale=".5 .5 .5">
        <a-entity id="anchor">
          <a-entity id="pivot">

            <!-- pelota -->
            <a-entity id="ball" gltf-model="#ball-model"></a-entity>
            <!-- portería -->
            <a-entity 
            id="net-goal" 
              gltf-model="#net-model" 
              position="0 0 -10" 
              rotation="0 -90 0" 
              scale=".3 .3 .3">
            </a-entity>

          </a-entity>
        </a-entity>
      </a-entity>
    </a-entity>

    <a-camera fov="60" position="0 0 0"
      look-controls="enabled: false"
      wasd-controls="enabled: false">
    </a-camera>

  </a-scene>

  <script src="js/audio.js"></script>
  <script src="js/dns.js"></script>
  <script src="js/stars.js"></script>
</body>
</html>
