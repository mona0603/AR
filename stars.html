<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stars</title>
  <link rel="icon" href="resources/UI/premio-de-futbol.png" type="image/png">
  
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
  crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <link rel="stylesheet" href="css/stars.css">
</head>
<body>

  <canvas id="star-canvas"></canvas>

  <a id="close" href="menu.html" data-sfx>
    <span><i class="fa-solid fa-chevron-left"></i></span>
  </a>

  <div id="mensaje-overlay">
    <p id="mensaje-texto"></p>
    <button onclick="cerrarMensaje()">Cerrar</button>
  </div>

  <div id="animation-controls">
    <div class="btn-img" id="btn-anim-2" onclick="reproducirAnimacion('block'); explotar(this)" data-sfx>
      <img src="resources/UI/bloqueo.png" alt="">
    </div>
    <div class="btn-img" id="btn-anim-3" onclick="reproducirAnimacion('Armature.001|mixamo.com|Layer0.002'); explotar(this)" data-sfx>
      <img src="resources/UI/triste.png" alt="">
    </div>
    <div class="btn-img" id="btn-anim-1" onclick="reproducirAnimacion('pass'); explotar(this)" data-sfx>
      <img src="resources/UI/pase.png" alt="">
    </div>
    <div class="btn-img" id="btn-anim-4" onclick="reproducirAnimacion('wave'); explotar(this)" data-sfx>
      <img src="resources/UI/feliz.png" alt="">
    </div>
  </div>

  <div id="texture-controls">
    <div class="country-w" data-sfx>
      <div class="country-img">
        <img src="resources/UI/" alt="" id="country">
      </div>
    </div>
    <div class="lvl-wrapper">
      <div class="lvl-ui">
        <div class="lvl-no">
          <span>LVL.</span>
          <span id="player-lvl">?</span>
        </div>
        <div class="lvl-bar">
          <div class="lvlb">
            <div class="lvlb-progress" id="player-lvl-bar"></div>
          </div>
          <span id="player-lvl-txt">?/?</span>
        </div>
      </div>
    </div>
    <div class="p-wrapper">
      <div class="p-ui">
        <div class="p-no">
          <span><i class="fa-solid fa-dumbbell"></i></span>
        </div>
        <div class="p-bar">
          <span id="player-fuerza">?</span>
        </div>
      </div>
    </div>
    <div class="t-wrapper">
      <div class="t-ui">
        <div class="t-no">
          <span><i class="fa-solid fa-star"></i></span>
        </div>
        <div class="t-bar">
          <span id="player-total">?</span>
        </div>
      </div>
    </div>
    <button id="trivia" onclick="window.location.href='trivia.html'" data-sfx><i class="fa-solid fa-hashtag"></i></button>
  </div>

  <div class="btn-prev-next">
    <div id="prev-btn" data-sfx><span><i class="fa-solid fa-chevron-left"></i></span></div>
    <div id="next-btn" data-sfx><span><i class="fa-solid fa-chevron-right"></i></span></div>
  </div>

  <div class="ui-player">
    <div class="ui-header">
      <div class="ui-title">
        <div class="ui-wrap-title">
          <div class="uic"><img src="resources/UI/medalla-de-oro.png" alt=""></div>
          <div class="ui-name" id="player-nombre"></div>
        </div>
      </div>
      <div id="player-name">
        <i class="fa-regular fa-hand"></i>
        <span id="player-descripcion">Scan to interact.</span>
      </div>
    </div>
  </div>

  <div class="card-stack" style="display: none;">
    <div class="card" data-sfx><span>This is an example.</span></div>
    <div class="card" data-sfx><span>This is an example.</span></div>
  </div>

  <!-- ================= AR ================= -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets/countries.mind;
                  autoStart: true;
                  uiScanning: no;
                  filterMinCF: 0.05;
                  filterBeta: 5;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; colorManagement: true;"
    device-orientation-permission-ui="enabled: false"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable; far: 100">

    <a-assets>
      <a-asset-item id="player-model" src="./models/playerfix.glb"></a-asset-item>
    </a-assets>

    <!-- <a-entity mindar-image-target="targetIndex: 0"></a-entity> -->

    <!-- boznia → index 1 -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-entity scale=".7 .7 .7">
        <a-entity id="anchor">
          <a-entity
            id="player-padre"
            gltf-model="#player-model"
            position="0 0 0"
            rotation="0 0 0"
            touch-rotate>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- brazil → index 2 -->
    <a-entity mindar-image-target="targetIndex: 2">
      <a-entity scale=".7 .7 .7">
        <a-entity>
          <a-entity
            class="player-instance"
            gltf-model="#player-model"
            position="0 0 0"
            rotation="0 0 0"
            touch-rotate>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- canada → index 3 -->

    </a-entity>

    </a-entity>

    <!-- sudafrica → index 12 -->
    <a-entity mindar-image-target="targetIndex: 12">
      <a-entity scale=".7 .7 .7">
        <a-entity>

    </a-entity>

    <!-- suiza → index 13 -->
    <a-entity mindar-image-target="targetIndex: 13">
      <a-entity scale=".7 .7 .7">
        <a-entity>
          <a-entity
            class="player-instance"
            gltf-model="#player-model"
            position="0 0 0"
            rotation="0 0 0"
            touch-rotate>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-entity>

    <a-light type="ambient"     color="#ffffff" intensity="0.8"></a-light>
    <a-light type="directional" color="#ffffff" intensity="1.2" position="0 5 0"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.6" position="5 3 -5"></a-light>
    <a-light type="point"       color="#ffffff" intensity="0.8" position="0 3 3"></a-light>

    <a-camera fov="60" position="0 0 0"
      look-controls="enabled: false"
      wasd-controls="enabled: false">
      <a-cursor
        fuse="false"
        color="white"
        opacity="1"
        geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02"
        material="color: white; shader: flat"
        position="0 0 -0.5"
        raycaster="objects: .clickable">
      </a-cursor>
    </a-camera>

  </a-scene>
  
  <script src="js/audio.js"></script>
  <script src="js/stars.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
