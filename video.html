<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Editor</title>
  <link rel="icon" href="resources/UI/video.png" type="image/png">

  <link rel="stylesheet" href="css/video.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

  <svg style="position: absolute; width: 0; height: 0;">
    <defs>
      <filter id="pixelate">
        <feFlood flood-color="transparent" result="flood"/>
        <feComposite in="flood" in2="SourceGraphic" operator="in" result="composite"/>
        <feMorphology operator="dilate" radius="1" result="dilate"/>
        <feGaussianBlur stdDeviation="0.5" result="blur"/>
        <feColorMatrix type="saturate" values="0.5" result="saturate"/>
        <feComposite in="saturate" in2="SourceGraphic" operator="over"/>
      </filter>
    </defs>
  </svg>

  <!-- Botón volver -->
  <a id="close" href="world.html" data-sfx>
    <span><i class="fa-solid fa-chevron-left"></i></span>
  </a>

  <!-- Contenedor principal del video (4:5 = 720x900) -->
  <div class="video-play">

    <!-- El video/canvas se inyecta aquí -->
    <div id="video-wrapper"></div>

    <!-- Barra lateral superpuesta -->
    <div class="vc-sidebar">

      <!-- Botón toggle -->
      <button class="vcb-toggle" id="sidebar-toggle" data-sfx>
        <div class="vcb-img">
          <i class="fa-solid fa-chevron-down"></i>
        </div>
      </button>

      <!-- Menú de filtros -->
      <div class="vc-menu" id="vc-menu">

        <!-- Blur -->
        <div class="vcb" data-effect="blur" data-sfx>
          <div class="vcb-img">
            <img src="resources/UI/filtros/gota-de-agua.png" alt="Desenfoque">
          </div>
        </div>

        <!-- Pixel -->
        <div class="vcb" data-effect="pixel" data-sfx>
          <div class="vcb-img">
            <img src="resources/UI/filtros/pixelado.png" alt="Pixeleado">
          </div>
        </div>

        <!-- Saturation -->
        <div class="vcb" data-effect="saturation" data-sfx>
          <div class="vcb-img">
            <img src="resources/UI/filtros/saturacion.png" alt="Saturación">
          </div>
        </div>

        <!-- Thermal -->
        <div class="vcb" data-effect="thermal" data-sfx>
          <div class="vcb-img">
            <img src="resources/UI/filtros/caliente.png" alt="Térmica">
          </div>
        </div>

        <!-- Reset -->
        <div class="vcb vcb--reset" id="vcb-reset" data-sfx>
          <div class="vcb-img vcb-img--reset">
            <img src="resources/UI/retry.png" alt="Restablecer">
          </div>
        </div>

      </div>
    </div>

    <!-- Nombre del filtro activo -->
    <div class="filters-name" id="filters-name"></div>

  </div>

  <!-- Mensaje sin video -->
  <div class="video-warning" id="video-warning" style="display: none;">
    <div class="vw-txt">
      <span><i class="fa-solid fa-triangle-exclamation"></i></span>
      <span>No video was found.</span>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/video.js"></script>
</body>
</html>
