<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>#Trivia</title>
  <link rel="icon" href="resources/UI/hashtag.png" type="image/png">

  <link rel="stylesheet" href="css/trivia.css">

  <!-- Fonts Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
  crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <a id="close" href="stars.html" data-sfx>
    <span><i class="fa-solid fa-chevron-left"></i></span>
  </a>
  <div class="container">
    <!-- <div class="c-sections">
      <span>1</span>
      <span>2</span>
      <span>3</span>
      <span>4</span>
    </div> -->
    <div class="container-wrapper">
      <!-- CLASS global para los botones: .sound-sfx -->
      <div class="c-rewind" data-sfx>
        <img src="resources/UI/retry.png" alt="reload">
      </div>
      <div class="cw-header">
        <!-- <div class="cw-circle"></div> -->
        <h1>TRIVIA</h1>
        <div class="cw-progress">
          <div class="cwp-bg">
            <div class="cwp-bar">
              <span id="percent">0%</span>
            </div>
          </div>
        </div>
      </div>
      <div class="cwq-wrapper">
        <div class="cw-questions">
          <div class="levels">
            <span>1/4</span>
          </div>
          <!-- <div id="progress" class="progress">Pregunta 1 de 20 - Nivel 1</div> -->
          <div id="question" class="question">
            <span>Who is this?</span>
          </div>
        </div>
      </div>
    </div>
    <div class="container-questions">
        <div id="options" class="options">
          <button class="option" data-sfx>Answer one<i class="fa-solid fa-angle-right"></i></button>
          <button class="option" data-sfx>2<i class="fa-solid fa-angle-right"></i></button>
          <button class="option" data-sfx>3<i class="fa-solid fa-angle-right"></i></button>
          <button class="option" data-sfx>4<i class="fa-solid fa-angle-right"></i></button>
        </div>
        <div id="result" class="result"></div>
        <div id="level-up" class="level-up"></div>
    </div>
    <div class="lvl-select">
      <div class="lvls-btn" ><img src="resources/UI/medalla.png" alt=""></div>
      <div class="lvls-btn" ><img src="resources/UI/medalla.png" alt=""></div>
      <div class="lvls-btn" ><img src="resources/UI/medalla.png" alt=""></div>
      <div class="lvls-btn" ><img src="resources/UI/medalla.png" alt=""></div>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/trivia.js"></script>
</body>
</html>
